# Render Blueprint — LiveQuizz Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: livequizz-server
    runtime: node
    region: singapore  # Low latency for South Asian classrooms
    plan: free
    buildCommand: cd server && npm install && cd ../student-web && npm install && npm run build && cd ../server && npx prisma db push
    startCommand: cd server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
